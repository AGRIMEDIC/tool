<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plantos Verde® — Tank Mixing Calculator</title>
<style>
:root{
  --green:#0A3D1F; --gold:#B8860B; --cream:#FBF7EE; --tint:#F4F1E5;
  --rule:#DCD5C8; --ink:#1E1E1E; --muted:#5C5C5C;
}
*{box-sizing:border-box}
body{margin:0;background:var(--tint);color:var(--ink);
  font-family:Calibri,"Carlito","Segoe UI",system-ui,"Noto Sans Arabic","Noto Sans Devanagari","Noto Sans SC",sans-serif;
  font-size:16px;line-height:1.5}
h1,h2,h3,.num{font-family:Cambria,"Caladea",Georgia,serif}
.wrap{max-width:960px;margin:0 auto;padding:0 20px 56px}

.logoband{background:#fff;border-bottom:3px solid var(--gold)}
.logoband-inner{direction:ltr;max-width:960px;margin:0 auto;padding:16px 20px;
  display:flex;align-items:center;justify-content:space-between;gap:16px}
.logoband-inner.solo{justify-content:center;padding-top:18px;padding-bottom:18px}
.logoband-inner img.ad{height:82px;width:auto}
.logoband-inner img.ag{height:56px;width:auto}
.logoband-inner img.pv{height:37px;width:auto}

.hero{background:var(--green);color:#EDE6D8;padding:26px 0 24px;margin-bottom:26px}
.hero-in{max-width:960px;margin:0 auto;padding:0 20px}
.hero h1{margin:0 0 6px;font-size:30px;color:#fff;letter-spacing:.2px}
.hero p.sub{margin:0;color:#DFD6C4;font-size:16px}
.notice{margin:16px 0 0;padding:10px 14px;border:1px solid var(--gold);
  border-radius:4px;color:#EDE6D8;font-size:13.5px}

.panel{background:#fff;border:1px solid var(--rule);border-radius:6px;
  padding:20px;margin-bottom:20px}
.panel h2{margin:0 0 16px;font-size:19px;color:var(--green);
  padding-bottom:8px;border-bottom:2px solid var(--gold)}

.row{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-end}
.fieldset{margin-bottom:18px}
.leg{font-size:12px;letter-spacing:.9px;text-transform:uppercase;
  color:var(--muted);margin-bottom:7px}
.seg{display:inline-flex;border:1px solid var(--green);border-radius:4px;overflow:hidden}
.seg button{appearance:none;border:0;background:#fff;color:var(--green);
  font:inherit;font-size:15px;padding:9px 18px;cursor:pointer}
.seg button+button{border-inline-start:1px solid var(--green)}
.seg button[aria-pressed="true"]{background:var(--green);color:#fff}

.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.f label{display:block;font-size:13.5px;color:var(--muted);margin-bottom:5px}
.inp{display:flex;align-items:stretch;border:1px solid var(--rule);border-radius:4px;
  background:#fff;overflow:hidden}
.inp input{flex:1;min-width:0;border:0;padding:11px 12px;font:inherit;font-size:17px;
  color:var(--ink);background:transparent;outline:none}
.inp input:focus{background:var(--tint)}
.unit{background:var(--tint);color:var(--muted);font-size:13.5px;
  display:flex;align-items:center;padding:0 12px;border-inline-start:1px solid var(--rule);
  white-space:nowrap}
select{font:inherit;font-size:15px;padding:8px 10px;border:1px solid var(--rule);
  border-radius:4px;background:#fff;color:var(--ink)}

.warn{display:none;margin-bottom:20px;padding:13px 16px;border-radius:5px;
  border:1px solid var(--gold);border-inline-start:5px solid var(--gold);
  background:var(--tint);color:var(--ink);font-size:14.5px}
.warn.on{display:block}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:20px}
.stat{background:var(--green);color:#EDE6D8;border-radius:6px;padding:18px 16px;text-align:center}
.stat .num{display:block;font-size:33px;color:#fff;line-height:1.12}
.stat .num small{font-size:16px;color:#DFD6C4}
.stat .cap{display:block;font-size:12.5px;color:#BFB7A6;margin-top:6px;
  text-transform:uppercase;letter-spacing:.7px}
.stat .note{display:block;font-size:12.5px;color:#DFD6C4;margin-top:7px;
  padding-top:7px;border-top:1px solid rgba(223,214,196,.35)}
.stat .note b{display:block;font-weight:normal}
.stat .note b+b{margin-top:3px}
.stat .note b:nth-child(3){margin-top:6px;color:#BFB7A6}
.stat .note:empty{display:none}

table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:10px 12px;font-weight:normal;border-bottom:1px solid var(--rule);text-align:start}
thead th{background:var(--green);color:#fff;font-family:Cambria,Georgia,serif;
  font-weight:normal;font-size:15px}
tbody tr:nth-child(even) th,tbody tr:nth-child(even) td{background:var(--tint)}
td.v{text-align:end;font-family:Cambria,Georgia,serif;white-space:nowrap}
tfoot td{font-size:13px;color:var(--muted);border-bottom:0;padding-top:12px}

.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
.opt h3{margin:0 0 4px;font-size:16.5px;color:var(--green)}
.opt p.d{margin:0 0 12px;font-size:13.5px;color:var(--muted);min-height:38px}
.opt dl{margin:0;font-size:14.5px}
.opt dl div{display:flex;justify-content:space-between;gap:12px;
  padding:7px 0;border-bottom:1px solid var(--rule)}
.opt dt{color:var(--muted)}
.opt dd{margin:0;font-family:Cambria,Georgia,serif;white-space:nowrap}
.exact{padding:12px 14px;background:var(--tint);border:1px solid var(--rule);
  border-radius:5px;font-size:14.5px}

.method{margin-top:18px;font-size:14px;color:var(--muted);
  padding-inline-start:14px;border-inline-start:3px solid var(--gold)}
.actions{margin-top:8px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn.alt{background:#fff;color:var(--green)}
.toast{display:none;font-size:14px;color:var(--green);padding:9px 14px;
  background:var(--tint);border:1px solid var(--gold);border-radius:4px}
.toast.on{display:block}
.btn{appearance:none;border:1px solid var(--green);background:var(--green);color:#fff;
  font:inherit;font-size:15px;padding:10px 20px;border-radius:4px;cursor:pointer}
footer{margin-top:22px;padding-top:14px;border-top:1px solid var(--rule);
  font-size:13px;color:var(--muted)}
.frow{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}
.contact{margin-top:7px;font-size:13px;color:var(--muted)}
.contact a{color:var(--green);text-decoration:none;border-bottom:1px solid var(--rule)}
.contact a:hover{border-bottom-color:var(--gold)}
.contact .sep{color:var(--rule);margin:0 9px}
.bottomband{margin-top:26px;padding:14px 0 0;border-top:1px solid var(--rule);
  display:flex;align-items:center;justify-content:center;gap:26px}
.bottomband img.ag{height:34px;width:auto}
.bottomband img.pv{height:22px;width:auto}
.prep{display:none}

@media (max-width:720px){
  .grid,.stats,.opts{grid-template-columns:1fr}
  .hero h1{font-size:25px}
  .stat .num{font-size:29px}
  .logoband-inner img.ad{height:60px}
  .logoband-inner img.ag{height:44px}
  .logoband-inner img.pv{height:29px}
  .bottomband{gap:18px}
  .bottomband img.ag{height:28px}
  .bottomband img.pv{height:19px}
  .contact .sep{margin:0 6px}
}

@media print{
  @page{size:A4 portrait;margin:13mm}
  body{background:#fff;color:#1E1E1E;font-size:11pt}
  .wrap{max-width:none;padding:0}
  .logoband{border-bottom:1.5pt solid #B8860B}
  .logoband-inner{padding:0 0 8pt}
  .logoband-inner.solo{padding:0 0 7pt}
  .logoband-inner img.ad{height:62px}
  .logoband-inner img.ag{height:40px}
  .logoband-inner img.pv{height:26px}
  .hero{background:none;color:#0A3D1F;padding:6pt 0 4pt;margin-bottom:7pt}
  .hero-in{padding:0}
  .hero h1{color:#0A3D1F;font-size:17pt}
  .hero p.sub{color:#5C5C5C;font-size:10.5pt}
  .notice,.controls,.inputs,.actions,.warn{display:none !important}
  .panel{border:0;padding:0;margin-bottom:6pt;break-inside:avoid}
  .panel h2{margin:0 0 5pt}
  .panel h2{font-size:13pt;color:#0A3D1F;border-bottom:1.2pt solid #B8860B}
  .stats{grid-template-columns:repeat(3,1fr) !important;gap:8pt;margin-bottom:7pt}
  .stat{background:none;border:1pt solid #0A3D1F;color:#1E1E1E;padding:6pt 5pt}
  .stat .num{color:#0A3D1F;font-size:17pt}
  .stat .num small{color:#5C5C5C;font-size:11pt}
  .stat .cap{color:#5C5C5C;font-size:8pt}
  .stat .note{color:#1E1E1E;font-size:7.5pt;margin-top:3pt;padding-top:3pt;
    border-top:.5pt solid #DCD5C8}
  .stat .note b+b{margin-top:1pt}
  .stat .note b:nth-child(3){margin-top:2.5pt;color:#5C5C5C}
  thead th{background:none;color:#0A3D1F;border-bottom:1.2pt solid #0A3D1F}
  tbody tr:nth-child(even) th,tbody tr:nth-child(even) td{background:none}
  th,td{padding:2.1pt 6pt;border-bottom:.5pt solid #DCD5C8}
  .method{margin-top:4pt;font-size:9pt}
  tfoot td{padding-top:6pt;font-size:8.5pt}
  .opts{grid-template-columns:repeat(2,1fr) !important;gap:14pt}
  .opt dl{font-size:10pt}
  .opt dl div{padding:2.2pt 0}
  .opt p.d{font-size:9.5pt;margin-bottom:8pt}
  footer{margin-top:5pt;padding-top:4pt;font-size:8.5pt}
  .contact{font-size:8.5pt;margin-top:4pt}
  .contact a{color:#0A3D1F;border-bottom:0}
  .bottomband{margin-top:4pt;padding-top:3pt;gap:16pt;break-inside:avoid}
  footer{display:flex;align-items:baseline;justify-content:space-between;gap:10pt;flex-wrap:wrap}
  .frow{display:contents}
  .frow span:first-child{order:1}
  .contact{margin-top:0;order:2}
  .prep{order:3}
  .bottomband img.ag{height:26px}
  .bottomband img.pv{height:17px}
  .opt{break-inside:avoid}
  .opt p.d{display:none}
  .opt h3{font-size:11pt;margin-bottom:6pt}
  .exact{background:none;border:.8pt solid #DCD5C8}
  .prep{display:block}
  footer{border-top:.8pt solid #DCD5C8}
}
/* ---- product row editor ---- */
.prow{display:grid;gap:8px;margin-bottom:10px;align-items:center;
  grid-template-columns:minmax(0,2.2fr) minmax(0,1.9fr) minmax(0,.9fr) minmax(0,.8fr) auto}
.prow input,.prow select{font:inherit;font-size:15px;padding:9px 10px;
  border:1px solid var(--rule);border-radius:4px;background:#fff;color:var(--ink);
  min-width:0;width:100%}
.prow input:focus,.prow select:focus{background:var(--tint);outline:none}
.rowbtns{display:flex;gap:4px}
.mini{appearance:none;border:1px solid var(--rule);background:#fff;color:var(--green);
  font:inherit;font-size:14px;line-height:1;width:30px;height:34px;border-radius:4px;cursor:pointer}
.mini:disabled{opacity:.3;cursor:default}
.mini.rm{color:#8A2A12}
.btn.small{font-size:14px;padding:8px 14px}

/* ---- products result table ---- */
.ptab th.v,.ptab td.v{text-align:end}
.ptab thead th{white-space:nowrap}
.ptab tbody th{font-weight:normal}
.ptab .sub{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.panel h2 .hsub{float:right;font-family:Calibri,"Carlito","Segoe UI",system-ui,sans-serif;
  font-size:14px;color:var(--muted);font-weight:normal}
.ptab tbody td:last-child{font-weight:bold}
.caveat p{margin:0 0 6px}
.caveat p:last-child{margin-bottom:0}
.caveat p.sep{color:var(--green)}

@media (max-width:720px){
  .prow{grid-template-columns:minmax(0,1fr) minmax(0,1fr);
    padding:12px;border:1px solid var(--rule);border-radius:5px;background:var(--tint)}
  .prow .pname{grid-column:1 / -1}
  .prow .pbasis{grid-column:1 / -1}
  .rowbtns{grid-column:1 / -1;justify-content:flex-end}
  .ptab thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .ptab,.ptab tbody,.ptab tr,.ptab th,.ptab td{display:block;width:auto}
  .ptab tbody tr{border:1px solid var(--rule);border-radius:5px;padding:10px 12px;margin-bottom:10px}
  .ptab tbody tr:nth-child(even) th,.ptab tbody tr:nth-child(even) td{background:none}
  .ptab tbody tr:nth-child(even){background:var(--tint)}
  .ptab tbody th{padding:0 0 8px;border-bottom:1px solid var(--rule);font-size:15px}
  .ptab tbody td{padding:6px 0 0;border:0;text-align:start;font-size:15px;
    display:flex;justify-content:space-between;gap:12px}
  .ptab tbody td::before{content:attr(data-label);color:var(--muted);font-size:13.5px;
    font-family:Calibri,"Carlito","Segoe UI",system-ui,sans-serif}
  .ptab tbody td:last-child{font-weight:bold}
  .panel h2 .hsub{float:none;display:block;margin-top:3px}
}

@media print{
  .prow,#prodEditor,#btnAdd{display:none !important}
  .ptab thead th{background:none;color:#0A3D1F;border-bottom:1.2pt solid #0A3D1F}
  .ptab .sub{font-size:8.5pt}
  .panel h2 .hsub{font-size:9pt;color:#5C5C5C}
  .caveat{font-size:8.5pt;margin-top:4pt}
  .caveat p.sep{color:#0A3D1F}
  .ptab .sub{display:inline;margin-inline-start:7px}
  #prodPanel{break-inside:avoid}
}

/* ---- snapshot mode: what the exported PDF sees ---- */
.snapmode .controls,.snapmode .inputs,.snapmode #prodEditor,
.snapmode .actions,.snapmode .notice,.snapmode .warn{display:none !important}
.snapmode .hero{padding-bottom:18px}

</style>
</head>

<script>
/* ------------------------------------------------------------------
   PDF export without a PDF library.

   Text is rasterised, not typeset, so there is no font embedding and
   no text shaping to get wrong - which is the only way Arabic, Hindi
   and Chinese can come out right in a file this size. The trade-off
   is that the PDF text is not selectable.
   ------------------------------------------------------------------ */

function bytes(str){
  var a = new Uint8Array(str.length);
  for(var i = 0; i < str.length; i++) a[i] = str.charCodeAt(i) & 0xFF;
  return a;
}
function b64bytes(b64){
  var bin = atob(b64), a = new Uint8Array(bin.length);
  for(var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
  return a;
}
function joinBytes(parts){
  var n = 0, i;
  for(i = 0; i < parts.length; i++) n += parts[i].length;
  var out = new Uint8Array(n), o = 0;
  for(i = 0; i < parts.length; i++){ out.set(parts[i], o); o += parts[i].length; }
  return out;
}

/* one-page PDF holding a single JPEG, sized to fit A4 with margins */
function jpegToPdf(jpeg, iw, ih){
  var PW = 595.28, PH = 841.89, M = 22;
  var sc = Math.min((PW - 2*M) / iw, (PH - 2*M) / ih);
  var w = iw * sc, h = ih * sc;
  var x = (PW - w) / 2, y = PH - M - h;

  var parts = [], offsets = [], pos = 0;
  function push(chunk){ parts.push(chunk); pos += chunk.length; }
  function obj(num, body, stream){
    offsets[num] = pos;
    push(bytes(num + " 0 obj\n" + body + "\n"));
    if(stream){
      push(bytes("stream\n"));
      push(stream);
      push(bytes("\nendstream\n"));
    }
    push(bytes("endobj\n"));
  }

  push(bytes("%PDF-1.4\n%\xE2\xE3\xCF\xD3\n"));
  obj(1, "<< /Type /Catalog /Pages 2 0 R >>");
  obj(2, "<< /Type /Pages /Kids [3 0 R] /Count 1 >>");
  obj(3, "<< /Type /Page /Parent 2 0 R /MediaBox [0 0 " + PW.toFixed(2) + " " + PH.toFixed(2) +
         "] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>");
  obj(4, "<< /Type /XObject /Subtype /Image /Width " + iw + " /Height " + ih +
         " /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length " +
         jpeg.length + " >>", jpeg);
  var content = "q " + w.toFixed(2) + " 0 0 " + h.toFixed(2) + " " +
                x.toFixed(2) + " " + y.toFixed(2) + " cm /Im0 Do Q";
  obj(5, "<< /Length " + content.length + " >>", bytes(content));

  var xref = pos;
  var s = "xref\n0 6\n0000000000 65535 f \n";
  for(var i = 1; i <= 5; i++){
    s += ("0000000000" + offsets[i]).slice(-10) + " 00000 n \n";
  }
  s += "trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n" + xref + "\n%%EOF\n";
  push(bytes(s));
  return new Blob([joinBytes(parts)], {type: "application/pdf"});
}

/* render the sheet (minus the interactive chrome) to a JPEG data URL */
function snapshot(){
  return new Promise(function(resolve, reject){
    var W = 900, SCALE = 2;

var LOCALE = {"en": "en-GB", "fr": "fr-FR", "es": "es-ES", "pt": "pt-PT", "de": "de-DE", "it": "it-IT", "pl": "pl-PL", "ru": "ru-RU", "uk": "uk-UA", "ar": "ar-EG-u-nu-latn", "zh": "zh-CN", "hi": "hi-IN", "sw": "sw-KE", "af": "af-ZA", "zu": "zu-ZA", "xh": "xh-ZA", "ss": "en-ZA"};
var RTL = ["ar"];

var lang = "en", equip = "drone", dir = "area", mode = "pv";
var LAST = null;
var rows = [];
var seq = 0;

function $(id){ return document.getElementById(id); }
function T(){ return STR[lang] || STR.en; }
function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

function fmt(n, dp){
  if(!isFinite(n)) return "-";
  var loc = LOCALE[lang] || "en-GB";
  try{
    return new Intl.NumberFormat(loc, {minimumFractionDigits:0, maximumFractionDigits:(dp===undefined?2:dp)}).format(n);
  }catch(e){ return n.toFixed(dp===undefined?2:dp); }
}
function unitv(n, dp, u){ return fmt(n, dp) + " " + u; }
function num(id){ var v = parseFloat($(id).value); return isFinite(v) ? v : 0; }

/* ---- amounts are held in ml (volume) or g (mass); display auto-scales ---- */
function fmtAmt(x, fam){
  var t = T();
  var big   = (fam === "vol") ? t.L  : t.kg;
  var small = (fam === "vol") ? t.ml : t.g;
  if(x >= 1000) return fmt(x/1000, 2) + " " + big;
  if(x >= 100)  return fmt(x, 0) + " " + small;
  if(x >= 10)   return fmt(x, 1) + " " + small;
  return fmt(x, 2) + " " + small;
}

function family(unit){ return (unit === "ml" || unit === "L") ? "vol" : "mass"; }

/* dose -> amount per litre of water, in ml or g */
function perLitre(r, waterRate){
  var v = parseFloat(r.value); if(!isFinite(v) || v <= 0) return 0;
  var base = v * ((r.unit === "L" || r.unit === "kg") ? 1000 : 1);
  if(r.basis === "perHa")  return waterRate > 0 ? base / waterRate : 0;
  if(r.basis === "perL")   return base;
  if(r.basis === "pct")    return v * 10;        /* 0.5% -> 5 per litre */
  if(r.basis === "ratio")  return v > 0 ? 1000 / v : 0;  /* 1:500 -> 2 per litre */
  return 0;
}

/* how the operator entered it, echoed on the sheet for traceability */
function doseLabel(r){
  var t = T(), v = parseFloat(r.value); if(!isFinite(v)) v = 0;
  if(r.basis === "perHa")  return fmt(v,2) + " " + r.unit + "/" + t.ha;
  if(r.basis === "perL")   return fmt(v,3) + " " + r.unit + "/" + t.L;
  if(r.basis === "pct")    return fmt(v,2) + " %";
  if(r.basis === "ratio")  return "1:" + fmt(v,0);
  return "";
}

/* ------------------------- product rows ------------------------- */
function defaultRows(){
  /* deliberately NOT seeded with Plantos Verde - it is applied on its own, never tank-mixed here */
  return [{id: ++seq, name: "", basis: "perL", value: "", unit: "ml"}];
}

function renderRows(){
  var t = T();
  var bases  = [["perHa",t.bPerHa],["perL",t.bPerL],["pct",t.bPct],["ratio",t.bRatio]];
  var uFull  = [["ml",t.ml],["L",t.L],["g",t.g],["kg",t.kg]];
  var uFam   = [["ml",t.ml],["g",t.g]];

  $("rowsWrap").innerHTML = rows.map(function(r, i){
    var famOnly = (r.basis === "pct" || r.basis === "ratio");
    var units = famOnly ? uFam : uFull;
    if(famOnly && (r.unit === "L" || r.unit === "kg")) r.unit = (r.unit === "L") ? "ml" : "g";
    return '<div class="prow" data-id="' + r.id + '">' +
      '<input class="pname" type="text" value="' + esc(r.name) + '" placeholder="' + esc(t.prodName) + '" aria-label="' + esc(t.prodName) + '">' +
      '<select class="pbasis" aria-label="' + esc(t.basis) + '">' +
        bases.map(function(b){ return '<option value="'+b[0]+'"'+(r.basis===b[0]?' selected':'')+'>'+esc(b[1])+'</option>'; }).join("") +
      '</select>' +
      '<input class="pval" type="number" min="0" step="any" inputmode="decimal" value="' + esc(r.value) + '" aria-label="' + esc(t.dose) + '">' +
      '<select class="punit" aria-label="' + esc(t.dose) + '">' +
        units.map(function(u){ return '<option value="'+u[0]+'"'+(r.unit===u[0]?' selected':'')+'>'+esc(u[1])+'</option>'; }).join("") +
      '</select>' +
      '<span class="rowbtns">' +
        '<button type="button" class="mini up" ' + (i===0?'disabled':'') + ' aria-label="up">\u2191</button>' +
        '<button type="button" class="mini dn" ' + (i===rows.length-1?'disabled':'') + ' aria-label="down">\u2193</button>' +
        '<button type="button" class="mini rm" aria-label="' + esc(t.remove) + '">\u00D7</button>' +
      '</span>' +
    '</div>';
  }).join("");
}

function rowIndex(el){
  var id = parseInt(el.closest(".prow").getAttribute("data-id"), 10);
  for(var i=0;i<rows.length;i++){ if(rows[i].id === id) return i; }
  return -1;
}

function wireRows(){
  var w = $("rowsWrap");
  w.addEventListener("input", function(e){
    var i = rowIndex(e.target); if(i < 0) return;
    if(e.target.classList.contains("pname")) rows[i].name = e.target.value;
    if(e.target.classList.contains("pval"))  rows[i].value = e.target.value;
    calc();
  });
  w.addEventListener("change", function(e){
    var i = rowIndex(e.target); if(i < 0) return;
    if(e.target.classList.contains("pbasis")){ rows[i].basis = e.target.value; renderRows(); }
    if(e.target.classList.contains("punit"))  rows[i].unit  = e.target.value;
    calc();
  });
  w.addEventListener("click", function(e){
    var b = e.target.closest("button.mini"); if(!b) return;
    var i = rowIndex(b); if(i < 0) return;
    if(b.classList.contains("rm")) rows.splice(i,1);
    if(b.classList.contains("up") && i > 0) rows.splice(i-1, 0, rows.splice(i,1)[0]);
    if(b.classList.contains("dn") && i < rows.length-1) rows.splice(i+1, 0, rows.splice(i,1)[0]);
    renderRows(); calc();
  });
  $("btnAdd").addEventListener("click", function(){
    if(rows.length >= 6) return;
    rows.push({id: ++seq, name: "", basis: "perL", value: "", unit: "ml"});
    renderRows(); calc();
  });
}

/* ------------------------- calculation ------------------------- */
function calc(){
  var t = T();
  var tank = num("tank"), water = num("water"), pvRate = num("pv");
  var minW = (mode === "mix") ? num("minw") : 30;
  var area;
  if(mode === "mix" || dir === "area"){ area = num("area"); }
  else { area = pvRate > 0 ? num("stock") / pvRate : 0; }

  var warn = $("warn"); warn.className = "warn";
  var live = (mode === "mix") ? rows.filter(function(r){ return perLitre(r, water) > 0; }) : [];

  var bad = (tank <= 0 || water <= 0 || area <= 0) ||
            (mode === "pv"  && pvRate <= 0) ||
            (mode === "mix" && live.length === 0);
  if(bad){
    warn.textContent = (mode === "mix" && live.length === 0 && tank > 0 && water > 0 && area > 0)
      ? t.emptyRows : t.warnVal;
    warn.className = "warn on";
    $("s1").textContent = "-"; $("s2").textContent = "-"; $("s3").textContent = "-";
    $("bdBody").innerHTML = ""; $("optWrap").innerHTML = ""; $("prodBody").innerHTML = "";
    $("s1note").textContent = ""; $("s2note").textContent = "";
    LAST = null;
    return;
  }
  if(equip === "drone" && minW > 0 && water < minW){
    warn.textContent = t.warnMin.replace("{n}", fmt(minW, 0));
    warn.className = "warn on";
  }

  var totalW    = area * water;
  var haPerTank = tank / water;
  var fullTanks = Math.floor(totalW / tank + 1e-9);
  var remW      = totalW - fullTanks * tank;
  if(remW < 1e-6) remW = 0;
  var ceilTanks = remW > 0 ? fullTanks + 1 : fullTanks;

  LAST = {mode: mode, rows: null, prods: null, opt: null,
          warn: (equip === "drone" && minW > 0 && water < minW) ? t.warnMin.replace("{n}", fmt(minW,0)) : null};

  /* the headline count rounds up - spell out that the last load is a part tank,
     or an operator will mix every tank full and over-apply */
  $("s1note").textContent = remW > 0
    ? fmt(fullTanks, 0) + " \u00D7 " + unitv(tank, 0, t.L) + "  +  1 \u00D7 " + unitv(remW, 1, t.L)
    : "";

  var bd, prods = [];

  if(mode === "pv"){
    var conc = pvRate / water, gL = conc * 1000;
    var pvPerTank = conc * tank, totalPV = area * pvRate;

    /* mirror of the tanks sub-line: what 6 full, 6 + part, and 7 full each cost in product */
    $("s2note").innerHTML = (remW > 0)
      ? "<b>" + fmt(fullTanks,0) + " \u00D7 " + unitv(pvPerTank,2,t.kg)
          + "  =  " + unitv(pvPerTank*fullTanks,2,t.kg) + "</b>"
      + "<b>+ " + unitv(conc*remW,2,t.kg) + "  =  " + unitv(totalPV,2,t.kg) + "</b>"
      + "<b>" + fmt(ceilTanks,0) + " \u00D7 " + unitv(pvPerTank,2,t.kg)
          + "  =  " + unitv(pvPerTank*ceilTanks,2,t.kg) + "</b>"
      : "";

    $("s1").textContent = fmt(ceilTanks, 0);
    $("s2").innerHTML   = fmt(pvPerTank, 2) + ' <small>' + t.kg + '</small>';
    $("s3").innerHTML   = fmt(gL, 1) + ' <small>' + t.gL + '</small>';
    $("c1").textContent = t.stTanks; $("c2").textContent = t.stPerTank; $("c3").textContent = t.stConc;

    bd = [
      [t.tankLbl,   unitv(tank, 0, t.L)],
      [t.waterLbl,  unitv(water, 0, t.LHa)],
      [t.pvLbl,     unitv(pvRate, 2, t.kgHa)],
      [t.bdArea,    unitv(area, 2, t.ha)],
      [t.bdWater,   unitv(totalW, 0, t.L)],
      [t.bdPV,      unitv(totalPV, 2, t.kg)],
      [t.bdHaTank,  unitv(haPerTank, 2, t.ha)],
      [t.stPerTank, unitv(pvPerTank, 2, t.kg)],
      [t.stConc,    unitv(gL, 1, t.gL)],
      [t.bdFull,    fmt(fullTanks, 0)]
    ];
    LAST.pv = {perTank: pvPerTank, total: totalPV, last: conc * remW, fam: "mass"};
  } else {
    $("s1").textContent = fmt(ceilTanks, 0);
    $("s2").innerHTML   = fmt(haPerTank, 2) + ' <small>' + t.ha + '</small>';
    $("s3").innerHTML   = fmt(totalW, 0) + ' <small>' + t.L + '</small>';
    $("c1").textContent = t.stTanks; $("c2").textContent = t.bdHaTank; $("c3").textContent = t.bdWater;
    $("s2note").textContent = "";

    prods = live.map(function(r, i){
      var pl = perLitre(r, water), fam = family(r.unit);
      return {
        name: (r.name && r.name.trim()) ? r.name.trim() : (t.prodName + " " + (i+1)),
        dose: doseLabel(r), fam: fam,
        perHa: pl * water, perTank: pl * tank,
        total: pl * water * area, last: pl * remW, perTankB: pl * tank * ceilTanks
      };
    });

    /* total water and area-per-tank are already the 2nd and 3rd stat cards
       directly above this table - do not repeat them here */
    bd = [
      [t.tankLbl,  unitv(tank, 0, t.L)],
      [t.waterLbl, unitv(water, 0, t.LHa)],
      [t.bdArea,   unitv(area, 2, t.ha)],
      [t.bdFull,   fmt(fullTanks, 0)]
    ];
  }

  LAST.rows = bd; LAST.prods = prods;

  $("bdBody").innerHTML = bd.map(function(r){
    return '<tr><th scope="row">' + esc(r[0]) + '</th><td class="v">' + esc(r[1]) + '</td></tr>';
  }).join("");

  var tf = $("t-bdConcF").closest("tfoot");
  if(tf) tf.style.display = (mode === "pv") ? "" : "none";
  /* heading carries the area, so the totals column is unambiguously "for this job" */
  if(mode === "mix"){
    $("t-products2").innerHTML = esc(t.products) +
      '<span class="hsub">' + esc(unitv(area, 2, t.ha)) + '</span>';
  }
  $("prodPanel").style.display = (mode === "mix") ? "" : "none";
  $("prodEditor").style.display = (mode === "mix") ? "" : "none";
  $("caveats").style.display = (mode === "mix") ? "" : "none";
  $("methodNote").style.display = (mode === "mix") ? "none" : "";

  if(mode === "mix"){
    /* data-label drives the stacked card layout on narrow screens */
    $("prodBody").innerHTML = prods.map(function(p){
      return '<tr><th scope="row">' + esc(p.name) + '<span class="sub">' + esc(p.dose) + '</span></th>' +
             '<td class="v" data-label="' + esc(t.perHaCol) + '">' + fmtAmt(p.perHa, p.fam) + '</td>' +
             '<td class="v" data-label="' + esc(t.perTankHdr) + '">' + fmtAmt(p.perTank, p.fam) + '</td>' +
             '<td class="v" data-label="' + esc(t.wholeJob) + '">' + fmtAmt(p.total, p.fam) + '</td></tr>';
    }).join("");
  }

  if(remW === 0){
    LAST.opt = {exact: t.exact};
    $("optWrap").innerHTML = '<div class="exact">' + esc(t.exact) + '</div>';
    return;
  }

  var surplusW = tank - remW, extraHa = surplusW / water;
  var aRows = [[t.tanksTot, fmt(fullTanks,0) + " + 1"], [t.lastW, unitv(remW, 1, t.L)]];
  var bRows = [[t.tanksTot, fmt(ceilTanks,0)], [t.surplus, unitv(surplusW, 1, t.L)], [t.extra, unitv(extraHa, 2, t.ha)]];

  if(mode === "pv"){
    aRows.push([t.lastP, unitv(LAST.pv.last, 2, t.kg)]);
    aRows.push([t.pvTot, unitv(LAST.pv.total, 2, t.kg)]);
    bRows.push([t.stPerTank, unitv(LAST.pv.perTank, 2, t.kg)]);
    bRows.push([t.pvTot, unitv(LAST.pv.perTank * ceilTanks, 2, t.kg)]);
  } else {
    prods.forEach(function(p){ aRows.push([p.name, fmtAmt(p.last, p.fam)]); });
    prods.forEach(function(p){ bRows.push([p.name, fmtAmt(p.perTankB, p.fam)]); });
  }

  LAST.opt = {a:{h:t.optA, rows:aRows}, b:{h:t.optB, rows:bRows}};

  function dl(items){
    return '<dl>' + items.map(function(i){
      return '<div><dt>' + esc(i[0]) + '</dt><dd>' + esc(i[1]) + '</dd></div>';
    }).join("") + '</dl>';
  }
  $("optWrap").innerHTML =
    '<div class="opts">' +
      '<div class="opt"><h3>' + esc(t.optA) + '</h3><p class="d">' + esc(t.optAd) + '</p>' + dl(aRows) + '</div>' +
      '<div class="opt"><h3>' + esc(t.optB) + '</h3><p class="d">' + esc(t.optBd) + '</p>' + dl(bRows) + '</div>' +
    '</div>';
}

function renderContact(){
  var list = CONTACTS[mode === "pv" ? "pv" : "mix"];
  $("contact").innerHTML = list.map(function(c){
    return '<a href="' + c.h + '" target="_blank" rel="noopener noreferrer">' + esc(c.t) + '</a>';
  }).join('<span class="sep">\u00B7</span>');
}

function shareText(){
  if(!LAST) return null;
  var t = T(), NL = String.fromCharCode(10), out = [];
  out.push(t.title.toUpperCase());
  out.push((mode === "pv" ? "Plantos Verde\u00AE" : t.modeMix) + " \u2014 " + (equip === "drone" ? t.drone : t.boom));
  out.push("");
  LAST.rows.forEach(function(r){ out.push(r[0] + ": " + r[1]); });
  if(LAST.prods && LAST.prods.length){
    out.push("");
    out.push(t.perTankHdr.toUpperCase());
    LAST.prods.forEach(function(p){
      out.push("  " + p.name + " (" + p.dose + "): " + fmtAmt(p.perTank, p.fam));
    });
    out.push("");
    out.push(t.wholeJob.toUpperCase());
    LAST.prods.forEach(function(p){ out.push("  " + p.name + ": " + fmtAmt(p.total, p.fam)); });
  }
  out.push("");
  if(LAST.opt.exact){ out.push(LAST.opt.exact); }
  else {
    [LAST.opt.a, LAST.opt.b].forEach(function(o){
      out.push(o.h);
      o.rows.forEach(function(r){ out.push("  " + r[0] + ": " + r[1]); });
      out.push("");
    });
  }
  if(mode === "pv"){ out.push(t.howto); }
  else { out.push(t.pvSep); out.push(t.lblLabel); out.push(t.lblCompat); }
  if(LAST.warn){ out.push(""); out.push("\u26A0 " + LAST.warn); }
  out.push("");
  out.push(t.foot);
  out.push(CONTACTS[mode === "pv" ? "pv" : "mix"].map(function(c){ return c.t; }).join("  |  "));
  return out.join(NL).replace(new RegExp(NL + "{3,}", "g"), NL + NL);
}

function toast(msg){
  var el = $("toast");
  el.textContent = msg; el.className = "toast on";
  clearTimeout(el._tid);
  el._tid = setTimeout(function(){ el.className = "toast"; }, 4500);
}
function copyFallback(txt){
  var ta = document.createElement("textarea");
  ta.value = txt; ta.setAttribute("readonly","");
  ta.style.position = "fixed"; ta.style.top = "-1000px"; ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.select(); ta.setSelectionRange(0, ta.value.length);
  var ok = false;
  try{ ok = document.execCommand("copy"); }catch(e){ ok = false; }
  document.body.removeChild(ta);
  return ok;
}
function forwardText(){
  var t = T(), txt = shareText();
  if(!txt) return;
  if(navigator.share){
    navigator.share({title: "Plantos Verde\u00AE \u2014 " + t.title, text: txt}).catch(function(){});
    return;
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){ toast(t.copied); })
      .catch(function(){ if(copyFallback(txt)) toast(t.copied); });
    return;
  }
  if(copyFallback(txt)) toast(t.copied);
}

function forward(){
  var t = T();
  if(!LAST) return;
  var btn = $("btnFwd"), label = btn.textContent;
  btn.disabled = true; btn.textContent = t.working;

  buildPdfBlob().then(function(blob){
    var name = pdfFilename();
    var file = null;
    try{ file = new File([blob], name, {type: "application/pdf"}); }catch(e){ file = null; }

    if(file && navigator.canShare && navigator.canShare({files: [file]}) && navigator.share){
      return navigator.share({files: [file], title: name}).catch(function(err){
        /* user cancelling the share sheet is not a failure */
        if(err && err.name === "AbortError") return;
        throw err;
      });
    }
    /* no file sharing on this device - hand over the PDF directly */
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
    toast(t.pdfSaved);
  }).catch(function(){
    /* rasterising can fail on some mobile browsers - never leave the user with nothing */
    document.body.classList.remove("snapmode");
    toast(t.pdfFail);
    forwardText();
  }).then(function(){
    btn.disabled = false; btn.textContent = label;
  });
}

function paint(){
  var t = T();
  document.documentElement.lang = lang;
  document.documentElement.dir  = RTL.indexOf(lang) >= 0 ? "rtl" : "ltr";
  document.title = "Plantos Verde\u00AE \u2014 " + t.title;

  ["title","sub","notice","lang","equip","drone","boom","calcby","byarea","bystock",
   "areaLbl","stockLbl","tankLbl","waterLbl","pvLbl","bd","bdConcF","howto","foot",
   "mode","modePV","modeMix","products","addRow","minW","lblLabel","lblCompat","pvSep"].forEach(function(k){
    var el = $("t-" + k); if(el) el.textContent = t[k];

  $("t-sub").textContent = (mode === "pv") ? t.sub : t.subOther;
  renderContact();
  $("btnPrint").textContent = t.print;
  $("btnFwd").textContent   = t.fwd;

  $("toast").className = "toast";

  $("t-products2").textContent = t.products;
  $("h-prod").textContent = t.prodName;
  $("h-perha").textContent = t.perHaCol;
  $("h-pertank").textContent = t.perTankHdr;
  $("h-total").textContent = t.wholeJob;   /* area appended in calc() */

  $("u-area").textContent  = t.ha;
  $("u-stock").textContent = t.kg;
  $("u-tank").textContent  = t.L;
  $("u-water").textContent = t.LHa;
  $("u-pv").textContent    = t.kgHa;
  $("u-minw").textContent  = t.LHa;

  var d = new Date(), loc = LOCALE[lang] || "en-GB";
  try{
    $("prep").textContent = t.prep + " " + new Intl.DateTimeFormat(loc, {year:"numeric",month:"long",day:"numeric"}).format(d);
  }catch(e){ $("prep").textContent = t.prep + " " + d.toISOString().slice(0,10); }

  renderRows();
  calc();
}

function applyMode(){
  var pv = (mode === "pv");
  $("fPV").style.display     = pv ? "" : "none";
  $("fMinW").style.display   = pv ? "none" : "";
  $("fsDir").style.display   = pv ? "" : "none";
  $("prodEditor").style.display = pv ? "none" : "";
  /* Agri Delta brands the other-products sheet; Agrimedic + PV move to the foot */
  $("bandPV").style.display     = pv ? "" : "none";
  $("bandAD").style.display     = pv ? "none" : "flex";
  $("bottomBand").style.display = pv ? "none" : "flex";
  if(!pv){ dir = "area"; }
  $("fArea").style.display  = (pv && dir === "stock") ? "none" : "";
  $("fStock").style.display = (pv && dir === "stock") ? "" : "none";
  paint();
}

function seg(wrapId, cb){
  var w = $(wrapId);
  w.addEventListener("click", function(e){
    var b = e.target.closest("button"); if(!b) return;
    Array.prototype.forEach.call(w.querySelectorAll("button"), function(x){
      x.setAttribute("aria-pressed", x === b ? "true" : "false");
    });
    cb(b.getAttribute("data-v"));
  });
}

seg("segMode", function(v){ mode = v; applyMode(); });
seg("segEquip", function(v){
  equip = v;
  if(v === "drone" && num("water") < 30)  $("water").value = 30;
  if(v === "boom"  && num("water") < 100) $("water").value = 250;
  calc();
});
seg("segDir", function(v){
  dir = v;
  $("fArea").style.display  = v === "area"  ? "" : "none";
  $("fStock").style.display = v === "stock" ? "" : "none";

});

["area","stock","tank","water","pv","minw"].forEach(function(id){

});
$("lang").addEventListener("change", function(){ lang = this.value; location.hash = lang; paint(); });

function fromHash(){

}
window.addEventListener("hashchange", fromHash);

rows = defaultRows();
wireRows();

paint();

<!-- ===================================================================
     Iframe auto-height. Posts this document's height to the parent page
     so the embedding site can resize the <iframe> and avoid inner
     scrollbars. Inert when the page is opened directly (not embedded).
     Message shape: { agrimedicCalculator: "tank-mixing", height: <px> }
     =================================================================== -->
<script>
(function () {
  if (window.self === window.top) return; // not embedded — do nothing
  var ID = "tank-mixing", last = 0;
  function height() {
    var d = document;
    return Math.ceil(Math.max(
      d.body ? d.body.scrollHeight : 0,
      d.body ? d.body.offsetHeight : 0,
      d.documentElement.scrollHeight,
      d.documentElement.offsetHeight,
      d.documentElement.getBoundingClientRect().height
    ));
  }
  function send() {
    var h = height();
    if (h && Math.abs(h - last) > 2) {
      last = h;
      try { window.parent.postMessage({ agrimedicCalculator: ID, height: h }, "*"); } catch (e) {}
    }
  }
  if (window.ResizeObserver) {
    try { new ResizeObserver(send).observe(document.documentElement); } catch (e) {}
  }
  window.addEventListener("load", send);
  window.addEventListener("resize", send);
  document.addEventListener("input", send, true);
  document.addEventListener("change", send, true);
  document.addEventListener("click", function () { setTimeout(send, 60); }, true);
  setInterval(send, 1000); // belt-and-braces for browsers without ResizeObserver
  send();
})();
</script>
